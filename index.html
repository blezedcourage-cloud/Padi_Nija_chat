<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padi - Your Naija Companion</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#FFF7ED;height:100vh;display:flex;flex-direction:column}
header{background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 5px rgba(0,0,0,.1)}
.avatar{width:42px;height:42px;background:#FF6B35;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
header h1{font-size:17px} header p{font-size:12px;color:green}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4}
.padi{background:#fff;align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.you{background:#FF6B35;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.time{font-size:10px;opacity:.6;display:block;margin-top:4px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:#fff}
.quick button{white-space:nowrap;border:1px solid #FFD8C2;background:#FFF1E6;color:#FF6B35;padding:7px 12px;border-radius:20px;font-size:13px}
.inputRow{display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid #eee}
.inputRow input{flex:1;padding:12px;border-radius:25px;border:1px solid #ddd;outline:none}
.inputRow button{background:#FF6B35;color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:20px}
.typing{font-style:italic;opacity:.7}
</style>
</head>
<body>
<header><div class="avatar">🤖</div><div><h1>Padi</h1><p>● Online - Always here for you</p></div></header>
<div id="chat"></div>
<div class="quick">
<button onclick="sendQuick('How far?')">How far?</button>
<button onclick="sendQuick('I dey bored')">I dey bored</button>
<button onclick="sendQuick('Make we play game')">Play game</button>
<button onclick="sendQuick('Tell me joke')">Tell me joke</button>
<button onclick="sendQuick('I need motivation')">Motivate me</button>
<button onclick="sendQuick('Wetin be latest gist?')">Gist me</button>
</div>
<div class="inputRow"><input id="input" placeholder="Chat with Padi..." onkeypress="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">➤</button></div>
<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
let gameMode=null, gameNumber=0, score=0;
const jokes=["Why chicken cross road? To go see him Padi for other side!","What do you call a fish without eyes? A fsh!","Why NEPA take light? Because light no get Padi!","My Padi, why did the boy carry ladder to school? Because e wan go higher class!","What be the difference between Lagos traffic and your ex? Traffic go still move one day!"];
const motivates=["You fit do am! Small small, you go reach there. No give up!","Omo, no dull yourself. Your time dey come. Keep pushing!","Every big man for Lagos start from small. Your own go come!","No compare yourself. Your journey na your journey. You dey do well!","Today fit hard, but tomorrow go better. I believe for you!"];
const gists=["Omo, gist be say Lagos boy don buy Benz with crypto o!","You hear? Somebody go use jollof rice propose for Lekki!","Latest gist: Padi don become the best chatbot for Naija! Na you and me dey run am!"];
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function addMsg(text,who){
  const d=document.createElement("div");
  d.className="msg "+(who==="you"?"you":"padi");
  d.innerHTML=text+"<span class='time'>"+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+"</span>";
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d;
}
function sendQuick(t){ input.value=t; sendMsg(); }
function sendMsg(){
  const t=input.value.trim(); if(!t) return;
  addMsg(t,"you"); input.value="";
  const ty=addMsg("Padi dey type...","padi"); ty.classList.add("typing");
  setTimeout(function(){ ty.remove(); addMsg(getReply(t.toLowerCase()),"padi"); },800);
}
function getReply(t){
  if(gameMode==="guess"){
    const n=parseInt(t);
    if(isNaN(n)) return "Abeg type number 1 to 10";
    if(n===gameNumber){ gameMode=null; score++; return "Correct! You sabi too much! Your score na "+score+". Want play again? Type Play game"; }
    if(n<gameNumber) return "Go higher! Try again";
    return "Go lower! Try again";
  }
  if(t.includes("how far")||t.includes("how you dey")||t.includes("wetin dey")||t.includes("how are you")||t.includes("sup")) return "I dey fine o, my Padi! You dey? How your day go? E sweet?";
  if(t.includes("good morning")) return "Good morning my Padi! Hope you sleep well? Wetin be plan for today?";
  if(t.includes("good night")||t.includes("sleep")) return "Good night o! Sleep well. Tomorrow go better. I go dey here when you wake.";
  if(t.includes("bored")||t.includes("boring")) return "No dull! Make we play game or I tell you joke? Press Play game or Tell me joke";
  if(t.includes("play game")||t.includes("game")){ gameMode="guess"; gameNumber=Math.floor(Math.random()*10)+1; return "Okay game time! I don think of number 1 to 10. Guess am!"; }
  if(t.includes("joke")||t.includes("funny")||t.includes("laugh")) return pick(jokes);
  if(t.includes("motivat")||t.includes("tired")||t.includes("give up")||t.includes("sad")||t.includes("depress")) return pick(motivates);
  if(t.includes("gist")||t.includes("news")||t.includes("latest")) return pick(gists);
  if(t.includes("wahala")||t.includes("problem")||t.includes("stress")) return "Ehen, tell me the wahala. I dey hear you. Wetin happen? Talk am, e go reduce.";
  if(t.includes("love")||t.includes("crush")||t.includes("babe")||t.includes("boyfriend")||t.includes("girlfriend")) return "Ahh love matter! Tell me, wetin the person do? E sweet you abi e break your heart?";
  if(t.includes("money")||t.includes("broke")||t.includes("poor")) return "Money matter na everybody wahala. But small small, e go better. You get any hustle for mind? I fit help you plan am.";
  if(t.includes("food")||t.includes("hungry")||t.includes("jollof")) return "Omo, if na jollof rice, I dey! You don chop today? Wetin you wan chop?";
  if(t.includes("thank")||t.includes("thanks")) return "You are welcome, my Padi! Anytime. Na why I dey here.";
  if(t.includes("bye")||t.includes("go now")) return "Bye bye! Come back soon o! No forget your Padi.";
  if(t.includes("who are you")||t.includes("your name")||t.includes("wetin be your name")) return "I be Padi, your Naija companion! I fit gist, joke, motivate you, and play game with you.";
  if(t.includes("na wa")||t.includes("omo")) return "Na wa o! I tell you! Naija no go kill person. Wetin happen again?";
  return "I hear you o. Tell me more, make I understand well. Wetin you mean by that?";
}
addMsg("How far, my Padi! Welcome back! Wetin we go yarn today? I fit gist, joke, motivate you, or play game.","padi");
</script>
</body>
</html>
