<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padi - Your Smart Friend</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#0f1115;color:#fff;height:100dvh;display:flex;flex-direction:column}
header{background:#1a1d24;padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2a2e37}
.avatar{width:44px;height:44px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;font-size:22px}
header h1{font-size:17px} header p{font-size:12px;color:#25D366}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:11px 13px;border-radius:16px;font-size:15px;line-height:1.55;white-space:pre-wrap}
.me{align-self:flex-end;background:#25D366;color:#000;border-bottom-right-radius:4px}
.padi{align-self:flex-start;background:#22262f;border-bottom-left-radius:4px}
.time{font-size:10px;opacity:.6;display:block;margin-top:4px;text-align:right}
#typing{display:none;padding:0 16px 8px;color:#aaa;font-size:13px}
#inputArea{display:flex;gap:8px;padding:12px;background:#1a1d24;border-top:1px solid #2a2e37}
input{flex:1;background:#2a2e37;border:none;outline:none;color:#fff;padding:12px 14px;border-radius:25px;font-size:15px}
button{background:#25D366;border:none;width:48px;height:48px;border-radius:50%;font-size:20px;cursor:pointer}
.quick{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;background:#1a1d24}
.quick button{width:auto;height:auto;padding:7px 12px;background:#2a2e37;color:#fff;font-size:13px;border-radius:20px;white-space:nowrap}
.speakBtn{background:#333;color:#fff;padding:6px 11px;border-radius:15px;font-size:12px;margin-top:7px;cursor:pointer;border:none}
</style>
</head>
<body>
<header>
<div class="avatar">🇳🇬</div>
<div><h1>Padi ❤️</h1><p>● Online • Speaks Good English • Fast</p></div>
</header>
<div id="chat"></div>
<div id="typing">Padi is thinking...</div>
<div class="quick">
<button onclick="quickSend('History of Lagos')">History of Lagos</button>
<button onclick="quickSend('History of Nigeria')">History of Nigeria</button>
<button onclick="quickSend('Who is Wole Soyinka?')">Who is Wole Soyinka?</button>
<button onclick="quickSend('How can I make money?')">How can I make money?</button>
<button onclick="quickSend('Tell me a joke')">Tell me a joke</button>
</div>
<div id="inputArea">
<input id="input" placeholder="Ask Padi anything..." autocomplete="off">
<button onclick="sendMsg()">➤</button>
</div>
<script>
const API_KEY = "AQ.Ab8RN6I-MojjsI21kSzBFCHT576fKHRo4UFMxSSv-q4WbLjz2g";
const chat=document.getElementById('chat');
const input=document.getElementById('input');
const typing=document.getElementById('typing');
function addMsg(text,who){
  const d=document.createElement('div');
  d.className='msg '+who;
  let html=text.replace(/\n/g,'<br>');
  if(who==='padi') html+='<br><button class="speakBtn" onclick="speak(this)">🔊 Let Padi Speak</button>';
  html+='<span class="time">'+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</span>';
  d.innerHTML=html;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}
function speak(btn){
  let txt=btn.parentElement.innerText.replace('🔊 Let Padi Speak','');
  let u=new SpeechSynthesisUtterance(txt); u.lang='en-GB'; u.rate=0.95; speechSynthesis.speak(u);
}
function quickSend(t){ input.value=t; sendMsg(); }
async function sendMsg(){
  const t=input.value.trim(); if(!t) return;
  addMsg(t,'me'); input.value='';
  typing.style.display='block';
  try{
    const reply = await askPadi(t);
    typing.style.display='none';
    addMsg(reply,'padi');
  }catch(e){
    typing.style.display='none';
    addMsg("Sorry my friend, Padi had a small problem. Please try again.","padi");
  }
}
input.addEventListener('keydown',e=>{ if(e.key==='Enter') sendMsg(); });
async function askPadi(userMsg){
  let low = userMsg.toLowerCase();
  if(low.includes('good morning')) return "Good morning, my friend! I hope you slept well. How are you feeling today?";
  if(low.includes('good afternoon')) return "Good afternoon! How is your day going? I hope it has been a good one so far.";
  if(low.includes('good evening')) return "Good evening, my friend! How was your day?";
  if(low.includes('good night')) return "Good night. Sleep well and have sweet dreams. I will be here tomorrow.";
  if(low.includes('my name is')) {
    let name = userMsg.replace(/my name is/i,'').trim();
    return "Nice to meet you, " + name + "! That is a beautiful name. How are you doing today, " + name + "?";
  }
  if(low.includes('how are you')) return "I am doing very well, thank you. Seeing your message has made my day better. How are you doing?";
  const prompt = "You are Padi, a friendly and intelligent Nigerian assistant. You must ALWAYS speak in good, correct, clear English. Use proper grammar, proper spelling, and clean sentences. Do not use Pidgin. Do not use slang. Use simple English that everyone can understand, but it must be good English. Be warm, polite, respectful and helpful like a good friend. Keep your answer clear and not too long, maximum 180 words, unless the user asks for a long history. If the user asks for history of a place, tell the history in a clear story form with good English. User said: " + userMsg;
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + API_KEY, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({contents: [{parts: [{text: prompt}]}]})
  });
  const data = await res.json();
  if(data.candidates && data.candidates[0] && data.candidates[0].content){
    return data.candidates[0].content.parts[0].text;
  }
  return "Sorry, Padi could not answer now. Please check your API key and try again.";
}
setTimeout(()=>{ addMsg("Hello, my friend! Welcome to Padi.\n\nI am Padi, your smart friend. I now answer very fast.\n\nYou can ask me anything:\n- History of Lagos, Kano, Nigeria, or any place\n- How to make money\n- School questions\n- Advice about life, love, or work\n- Jokes and stories\n\nTry: History of Lagos","padi"); },300);
</script>
</body>
</html>
