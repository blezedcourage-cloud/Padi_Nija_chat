<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padi Nija Chat</title>
<style>
body{font-family:sans-serif;background:#075e54;margin:0}
.top{background:#075e54;color:white;padding:15px;font-weight:bold;font-size:20px}
#chat{height:70vh;overflow:auto;padding:10px;background:#ece5dd}
.msg{background:white;padding:10px;border-radius:10px;margin:8px;max-width:80%}
.me{background:#dcf8c6;margin-left:auto}
.box{display:flex;padding:10px;background:white}
input{flex:1;padding:12px;border-radius:20px;border:1px solid #ccc}
button{background:#25d366;border:none;color:white;padding:12px 18px;border-radius:20px;margin-left:8px;font-weight:bold}
</style>
</head>
<body>
<div class="top">Padi Nija Chat</div>
<div id="chat">
<div class="msg">Welcome to Padi Nija Chat! How far?</div>
</div>
<div class="box">
<input id="text" placeholder="Type message...">
<button onclick="send()">Send</button>
</div>
<script>
function send(){
let t=document.getElementById('text');
if(!t.value) return;
let c=document.getElementById('chat');
c.innerHTML+='<div class="msg me">'+t.value+'</div>';
t.value='';
c.scrollTop=c.scrollHeight;
setTimeout(()=>{
c.innerHTML+='<div class="msg">Na wa! I hear you my padi</div>';
c.scrollTop=c.scrollHeight;
},800);
}
</script>
</body>
</html>
